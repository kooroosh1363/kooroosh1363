<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Peyman Raad — AI Agent and Automation Engineer</title>
  <desc id="desc">Royal-purple command center showing a reliable AI automation workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08040F"/>
      <stop offset="0.46" stop-color="#14082B"/>
      <stop offset="1" stop-color="#090512"/>
    </linearGradient>
    <linearGradient id="royal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#D8B4FE"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8B5CF6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="nodeGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C4B5FD" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .line{stroke:#8B5CF6;stroke-width:1.4;stroke-opacity:.48;stroke-dasharray:7 10;animation:flow 8s linear infinite}
    .pulse{animation:pulse 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse2{animation:pulse 3.4s ease-in-out 1.1s infinite;transform-box:fill-box;transform-origin:center}
    .float{animation:float 6s ease-in-out infinite}
    .blink{animation:blink 2.2s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-68}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.line,.pulse,.pulse2,.float,.blink{animation:none}}
  </style>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="930" cy="190" r="230" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M0 1H1200" stroke="url(#royal)" stroke-width="2"/>
  <g class="sans">
    <rect x="58" y="48" width="198" height="30" rx="15" fill="#6D28D9" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".55"/>
    <circle cx="76" cy="63" r="5" fill="#C4B5FD" class="blink"/>
    <text x="89" y="68" fill="#DDD6FE" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ONLINE</text>
    <text x="58" y="148" fill="#F8F7FF" font-size="57" font-weight="760" letter-spacing="-.8">Peyman Raad</text>
    <rect x="58" y="169" width="510" height="3" rx="2" fill="url(#royal)"/>
    <text x="58" y="216" fill="#C4B5FD" font-size="24" font-weight="650">AI Agent &amp; Automation Engineer</text>
    <text x="58" y="263" fill="#B8B0C7" font-size="17">I build testable systems that turn data and business rules</text>
    <text x="58" y="289" fill="#B8B0C7" font-size="17">into verified decisions and controlled automation.</text>
    <g transform="translate(58 332)">
      <rect width="150" height="37" rx="9" fill="#241044" stroke="#8B5CF6" stroke-opacity=".65"/>
      <text x="75" y="24" fill="#EDE9FE" font-size="13" font-weight="650" text-anchor="middle">RELIABLE AGENTS</text>
      <rect x="162" width="138" height="37" rx="9" fill="#241044" stroke="#8B5CF6" stroke-opacity=".65"/>
      <text x="231" y="24" fill="#EDE9FE" font-size="13" font-weight="650" text-anchor="middle">DATA SYSTEMS</text>
      <rect x="312" width="162" height="37" rx="9" fill="#241044" stroke="#8B5CF6" stroke-opacity=".65"/>
      <text x="393" y="24" fill="#EDE9FE" font-size="13" font-weight="650" text-anchor="middle">SAFE AUTOMATION</text>
    </g>
  </g>
  <g transform="translate(690 53)" class="float">
    <rect width="448" height="330" rx="24" fill="#100720" fill-opacity=".8" stroke="#8B5CF6" stroke-opacity=".35"/>
    <text x="28" y="36" class="mono" fill="#A78BFA" font-size="12" letter-spacing="1.5">AGENTIC CONTROL PLANE / LIVE</text>
    <text x="389" y="36" class="mono" fill="#7E748F" font-size="11">01—04</text>
    <path d="M66 172H155M199 172H288M332 172H386" class="line"/>
    <g class="sans" text-anchor="middle">
      <g transform="translate(34 125)"><rect width="90" height="94" rx="17" fill="#1E0D3B" stroke="#7C3AED"/><circle cx="45" cy="31" r="9" fill="#A78BFA" class="pulse" filter="url(#nodeGlow)"/><text x="45" y="60" fill="#F5F3FF" font-size="12" font-weight="700">INPUT</text><text x="45" y="77" fill="#8F86A3" font-size="10">contracts</text></g>
      <g transform="translate(143 125)"><rect width="90" height="94" rx="17" fill="#1E0D3B" stroke="#7C3AED"/><circle cx="45" cy="31" r="9" fill="#C084FC" class="pulse2" filter="url(#nodeGlow)"/><text x="45" y="60" fill="#F5F3FF" font-size="12" font-weight="700">AGENT</text><text x="45" y="77" fill="#8F86A3" font-size="10">bounded tools</text></g>
      <g transform="translate(252 125)"><rect width="90" height="94" rx="17" fill="#1E0D3B" stroke="#7C3AED"/><circle cx="45" cy="31" r="9" fill="#D8B4FE" class="pulse" filter="url(#nodeGlow)"/><text x="45" y="60" fill="#F5F3FF" font-size="12" font-weight="700">VERIFY</text><text x="45" y="77" fill="#8F86A3" font-size="10">tests + policy</text></g>
      <g transform="translate(361 125)"><rect width="70" height="94" rx="17" fill="#3B1768" stroke="#C4B5FD"/><circle cx="35" cy="31" r="9" fill="#F0ABFC" class="pulse2" filter="url(#nodeGlow)"/><text x="35" y="60" fill="#F5F3FF" font-size="12" font-weight="700">ACT</text><text x="35" y="77" fill="#BDB2CD" font-size="10">controlled</text></g>
    </g>
    <g class="mono" font-size="11">
      <text x="34" y="260" fill="#8F86A3">STATUS</text><text x="91" y="260" fill="#C4B5FD">observable</text>
      <text x="34" y="283" fill="#8F86A3">FAILURE</text><text x="91" y="283" fill="#C4B5FD">recoverable</text>
      <text x="252" y="260" fill="#8F86A3">HUMAN</text><text x="303" y="260" fill="#C4B5FD">in the loop</text>
      <text x="252" y="283" fill="#8F86A3">EVIDENCE</text><text x="318" y="283" fill="#C4B5FD">explicit</text>
    </g>
  </g>
</svg>

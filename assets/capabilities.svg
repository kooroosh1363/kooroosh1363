<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capabilities</title><desc id="desc">Four connected engineering capability cards in a royal-purple theme.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#0B0614"/><stop offset="1" stop-color="#170A2E"/></linearGradient><linearGradient id="accent"><stop stop-color="#6D28D9"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs>
  <style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.path{stroke-dasharray:6 9;animation:move 8s linear infinite}@keyframes move{to{stroke-dashoffset:-60}}@media(prefers-reduced-motion:reduce){.path{animation:none}}</style>
  <rect width="1200" height="290" rx="24" fill="url(#bg)"/>
  <text x="48" y="47" class="m" fill="#A78BFA" font-size="12" letter-spacing="2">ENGINEERING CAPABILITY MAP</text>
  <path d="M175 143H1025" stroke="#8B5CF6" stroke-opacity=".35" class="path"/>
  <g class="s">
    <g transform="translate(48 78)"><rect width="250" height="160" rx="18" fill="#160A2B" stroke="#6D28D9"/><text x="24" y="39" fill="#D8B4FE" font-size="13" font-weight="700">01 / AGENTIC SYSTEMS</text><text x="24" y="75" fill="#F8F7FF" font-size="18" font-weight="700">Agents with boundaries</text><text x="24" y="104" fill="#9E95AD" font-size="13">RAG · tools · evaluation</text><text x="24" y="127" fill="#9E95AD" font-size="13">human approval · guardrails</text><circle cx="218" cy="30" r="6" fill="#8B5CF6"/></g>
    <g transform="translate(333 78)"><rect width="250" height="160" rx="18" fill="#160A2B" stroke="#6D28D9"/><text x="24" y="39" fill="#D8B4FE" font-size="13" font-weight="700">02 / AUTOMATION</text><text x="24" y="75" fill="#F8F7FF" font-size="18" font-weight="700">Controlled workflows</text><text x="24" y="104" fill="#9E95AD" font-size="13">n8n · APIs · orchestration</text><text x="24" y="127" fill="#9E95AD" font-size="13">retries · escalation · SLA</text><circle cx="218" cy="30" r="6" fill="#A78BFA"/></g>
    <g transform="translate(618 78)"><rect width="250" height="160" rx="18" fill="#160A2B" stroke="#6D28D9"/><text x="24" y="39" fill="#D8B4FE" font-size="13" font-weight="700">03 / DATA &amp; DECISIONS</text><text x="24" y="75" fill="#F8F7FF" font-size="18" font-weight="700">Verified facts first</text><text x="24" y="104" fill="#9E95AD" font-size="13">Python · SQL · PostgreSQL</text><text x="24" y="127" fill="#9E95AD" font-size="13">analytics · ML · contracts</text><circle cx="218" cy="30" r="6" fill="#C084FC"/></g>
    <g transform="translate(903 78)"><rect width="249" height="160" rx="18" fill="#261044" stroke="url(#accent)"/><text x="24" y="39" fill="#E9D5FF" font-size="13" font-weight="700">04 / RELIABILITY</text><text x="24" y="75" fill="#F8F7FF" font-size="18" font-weight="700">Proof over claims</text><text x="24" y="104" fill="#B8AFC7" font-size="13">tests · CI · observability</text><text x="24" y="127" fill="#B8AFC7" font-size="13">security · recovery · limits</text><circle cx="217" cy="30" r="6" fill="#F0ABFC"/></g>
  </g>
</svg>
